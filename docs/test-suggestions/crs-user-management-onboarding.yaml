id: crs-user-management-onboarding
title: CRS user management, password reset, and login API
summary: >
  Exercise auth-server user CRUD, role change, non-admin 403, duplicate username,
  self fullName update, admin password reset, and temporary-password one-use via
  HTTP. Maps QA checklist sections 3, 6, and 7 (API only; ODD/App UI is out of
  scope). File product bugs under RQA-5847.
status: draft
updated: "2026-08-20"
release:
  monorepo_branch: chore_release-10.0.0
  compared_to_tag: null
  robot_os: 10.0.0-alpha.1
  tickets:
    - key: RQA-5847
      title: "10.0.0-alpha.1 Bugs"
    - key: RQA-5950
      title: "Self username change leaves the existing session unable to use /auth/users/self"
    - key: RQA-5952
      title: "Locking a user account does not revoke previously issued access tokens"
hardware_required:
  - flex (CRS-enabled)
  - HTTPS CA trust (ROBOT_USE_HTTPS=true)
harness:
  commands:
    - ROBOT_USE_HTTPS=true uv run flex-test inspect
    - ALLOW_MUTATIONS=true ROBOT_USE_HTTPS=true uv run flex-test crs users-api
    - ALLOW_MUTATIONS=true ROBOT_USE_HTTPS=true uv run flex-test crs probe
    - ALLOW_MUTATIONS=true ROBOT_USE_HTTPS=true uv run flex-test crs settings-suite --cases S1
tests:
  - id: U0
    name: Preconditions
    why: User CRUD needs CRS on, bootstrap admin, and operator fixture.
    steps:
      - GET /auth/settings/accessControlEnabled → true
      - flex-test crs provision-users if flex_test_operator missing
    result: skipped

  - id: U1
    name: Admin user CRUD verbs
    why: QA checklist §6 create, rename, full name, reset, delete.
    steps:
      - ALLOW_MUTATIONS=true uv run flex-test crs users-api
      - Expect POST /auth/users, GET byUsername, PATCH profile/rename, POST resetPassword, DELETE
    result: skipped

  - id: U2
    name: Change account type
    why: QA checklist §6 admin can change account type / role.
    steps:
      - Covered by users-api step patch_account_type (user → auditor → user)
    result: skipped

  - id: U3
    name: Duplicate username rejected
    why: QA checklist §6 admin cannot update/create to an existing username.
    steps:
      - Covered by users-api step post_duplicate_username_rejected (expect 409/422)
    result: skipped

  - id: U4
    name: Non-admin user mutations denied
    why: QA checklist §6 non-admin 403 on PATCH/DELETE users.
    steps:
      - Covered by users-api operator_patch_forbidden and operator_delete_forbidden
    result: skipped

  - id: U4b
    name: User can update own fullName
    why: QA checklist §6 / self profile; PATCH /auth/users/self with only fullName.
    steps:
      - Covered by users-api step patch_self_full_name (subject token, fullName only)
      - Live confirmed 2026-08-19 on KansasFLEX alpha.4 with flex_test_operator
    result: pass

  - id: U4c
    name: Existing session still works for /auth/users/self after username change (RQA-5950)
    why: >
      After PATCH /auth/users/self username, the same access token must still
      GET and PATCH /auth/users/self. Pre-rename tokens currently 500 (RQA-5950).
    steps:
      - Covered by users-api step self_routes_after_username_change
      - Rename self → same-token GET self + PATCH fullName → remint → restore
      - Expect 200 on both same-token self routes (fails while RQA-5950 is open)
    result: fail
    notes: >
      2026-08-19 KansasFLEX alpha.4: after rename, same token GET/PATCH
      /auth/users/self → 500 because the token subject is frozen at the old
      username; introspect still reports active with the old name. A fresh token
      for the new username works. Likely fix: refresh the session on username
      change, or resolve self by stable user id.

  - id: U8
    name: Admin actions revoke the target user's existing token (RQA-5952)
    why: >
      An administrator lock/delete/reset/role/username change on another user
      must immediately reject that user's previously issued access token.
      Changing only Legal name must leave the token valid.
    steps:
      - Covered by users-api token_revoked_after_admin_* and
        token_valid_after_admin_edit_legal_name
      - Mint subject token → admin PATCH/DELETE/resetPassword → GET /auth/users/self
        with the pre-change token
      - Expect 401/403 (404 also accepted after delete). Legal name expects 200.
    result: fail
    notes: >
      2026-08-20: RQA-5952 lock-account case still allows the pre-issued token.
      These users-api steps encode the full Gherkin matrix so a product fix can
      be verified without a two-machine App session. Probe is GET /auth/users/self
      only (identity-scoped).

  - id: U5
    name: Password reset one-use
    why: QA checklist §7 temp password works once; original password rejected.
    steps:
      - Covered by users-api original_password_rejected_after_reset and
        temp_password_rejected_after_rotation
    result: skipped

  - id: U6
    name: Account lock after failed logins
    why: QA checklist §3 / §6 deactivate after max attempts; admin can reactivate.
    steps:
      - ALLOW_MUTATIONS=true uv run flex-test crs settings-suite --cases S1
      - S1 creates ephemeral user, fails ROPC to threshold, asserts locked, reactivates
    result: skipped

  - id: U7
    name: Bad credentials do not mint tokens
    why: QA checklist §3 incorrect password / username.
    steps:
      - uv run flex-test crs lockdown --actors bad_oauth --strict-only
      - POST /auth/oauth2/token with wrong password must not return access_token
    result: skipped

notes: >
  ODD/Desktop login modal, locked overlay, and first-login UX are App/ODD, not this
  harness. Admin lock is PATCH locked=true; if that is rejected, file against
  auth-server. Logout/revoke has no dedicated auth-server route in the catalog;
  session end is idleLogout (settings-suite S6) when the client stops using the
  access token and does not refresh it; the App extends sessions via refresh-token
  grants. Admin lock/delete/reset/role/username also invalidate tokens (RQA-5952 /
  users-api U8).
  Implementation: capabilities/user_management_suite.py, flex-test crs users-api.
